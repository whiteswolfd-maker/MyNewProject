# 球对称 TNT—空气双场 PINN 的基础配置。
#
# 全部内部物理计算采用 SI：m、kg、s、Pa、J/kg。本文件里每一个描述**物理**的
# 数值都逐字对应提示词 §4 的表格；描述**算法**的数值都注明了它来自提示词哪一节。

meta:
  study: "自由空气中球形 TNT 爆炸，1D 球对称双场 PINN"
  reference_radius_m: 0.05      # R_ref，提示词 §5
  reference_start_time_s: 1.0e-6  # epsilon_ref，提示词 §5
  scheme: "B：中心起爆、有限爆速（卡片 D）传播形成非均匀爆后产物场；波前到达装药表面后接静止空气，短时双介质前置到交接时刻 T_h = T_b + epsilon"

# ---------------------------------------------------------------------------
# 材料参数（提示词 §4）。这是全仓库唯一的一份数值来源。
# ---------------------------------------------------------------------------
jwl:
  A: 3.7120e11        # Pa
  B: 3.7471e09        # Pa —— 旧项目里出现过的 3.231e9 不是本规范采用的值
  R1: 4.15
  R2: 0.95
  omega: 0.30
  rho0: 1630.0        # kg/m^3
  E0_volume_energy: 6.0e9   # J/m^3，按参考体积定义
  V0: 1.0
  energy_shift: 0.0   # J/kg
  # 仅供参考记录，不用于整球初始压力，也不用 CJ 重新标定 E0。
  detonation_velocity_reference: 6930.0
  p_cj_reference: 2.1e10

air:
  gamma: 1.4
  rho: 1.225
  # §4：这是**卡片**给出的环境压力（*EOS_LINEAR_POLYNOMIAL 的 E0 = 0.2533 MPa，
  # 经 e0 = E0/rho0 得 206775.510 J/kg，再得 p0 = (gamma-1) rho0 e0 = 101320 Pa），
  # **不是**标准大气压 101325 Pa。两者不能混用：DYNA 实际初始化出来的就是 101320，
  # 而 d3plot 里读得到。写 101325 会让 PINN 的环境态与训练数据差 5 Pa。
  pressure: 101320.0

# ---------------------------------------------------------------------------
# 参考前置求解（提示词 §5）。它给出参考初始场 q_ref(r, t)，是初值的唯一来源。
# ---------------------------------------------------------------------------
reference_field:
  # 产物场（爆轰阶段）自己的网格数。它与下面的 cells_inside 是两套网格：
  # 前者在 [0, R_0] 上均匀、用于构造波前到达时的产物场，后者是两介质前置的网格。
  detonation_cells: 2000
  charge_radius_m: 0.05
  cells_inside: 2000       # 装药内均匀网格数
  growth: 1.005            # 装药外网格几何放宽比
  outer_radius_factor: 40.0
  cfl: 0.2
  q1: 1.5                  # von Neumann–Richtmyer，与算例卡片一致
  q2: 0.06
  # 采样窗口是**相对 T_b** 的 [0, handover_margin * epsilon]，不是绝对物理时间。
  # 交接时刻 T_h 落在相对时间的 epsilon 处（50 mm：T_b = 7.215007 us，epsilon = 1 us，
  # T_h = 8.215007 us），所以 margin = 1.2 表示窗口在交接时刻之后再留 20% 余量。
  # 方案 A 时代这里乘的是 T_h 本身，语义已经变了——两个数都是秒，写错不会报错。
  handover_margin: 1.2
  sample_count: 41
  check_outer_boundary: 0.5  # 激波越过外半径的这个比例即报错

# ---------------------------------------------------------------------------
# 数据。`directory` 指向已验证的 (t, r, rho, u, P) 时空剖面。
# ---------------------------------------------------------------------------
data:
  field_map:
    time: t
    radius: x
    density: rho
    velocity: u
    pressure: P
  detector:
    shock_pressure_ratio: 1.0e-3
    contact_smoothing_cells: 5
    contact_density_ratio_floor: 1.02
    minimum_cells_per_medium: 3

  # 数据与方案 A 的兼容性（提示词 §3、§11）。训练入口读这份报告，状态不是
  # `compatible` 就直接停下——审查报告不能只是一个附件。
  # 省略时去 <output_dir>/dyna_audit/data_compatibility.json 找。
  compatibility_report: null
  # 在未核实的数据上训练必须显式说明；结果会被打上 data_compatibility=unverified。
  allow_unverified_cases: false
  # 只用于明确标注的合成样例；正式训练不得打开。
  synthetic_smoke: false

  # 训练/开发划分（§11）：按**连续帧组**留出，不是把同一帧的相邻网格点随机拆开。
  development_holdout_fraction: 0.1
  split_seed: 20260920

  # **下面这些目录还没有迁移到当前提取器。** F:/2/extracted 与两个 GitHub
  # 目录都是**旧格式**导出：没有逐字段有效性、没有前沿监督资格数组、材料分区
  # 来自启发式探测器。它们仍然写在这里，是因为正式训练用的就是这几个半径；
  # 而 §15 的数据契约会**拒绝**它们（训练入口返回码 4），所以"路径还指着旧的"
  # 不会变成"拿旧数据训练了"。
  #
  # 迁移需要按当前提取器重跑，命令见 IMPLEMENTATION_ROUND_2026-10-09.md 第 7 节。
  # 目前只有 50 / 100 mm 的**代表状态**重提过（`configs/experiments/geom_smoke.yaml`
  # 接的就是它们），那批数据帧数太少，**不能**当正式训练数据。
  cases:
    - case_id: tnt_50mm
      charge_radius_m: 0.050
      directory: F:/2/extracted
      split: train
    - case_id: tnt_80mm
      charge_radius_m: 0.080
      directory: C:/Users/work/Documents/GitHub/2/extracted_80mm
      split: train
    - case_id: tnt_100mm
      charge_radius_m: 0.100
      directory: C:/Users/work/Documents/GitHub/2/extracted_100mm
      split: train
    - case_id: tnt_500mm
      charge_radius_m: 0.500
      directory: D:/500mmtnt/extracted
      split: extrapolation_test

splits:
  strict_blind_test: true
  # §16：最终独立验证半径，mm。这些半径**不得**参与调参、初值标定、归一化极值、
  # 早停或选模。以前这条只靠上面那个 split 字符串，而 strict_blind_test 没有任何
  # 代码读它——把 500 mm 改写成 `split: train` 什么都不会报错。现在
  # `data/isolation.py` 按这份清单独立核对，训练入口会硬失败（返回码 5）。
  final_validation_radii_mm: [500.0]

# ---------------------------------------------------------------------------
# 网络（提示词 §7）
# ---------------------------------------------------------------------------
networks:
  dtype: float64
  product:
    width: 128
    depth: 4          # 4 个隐藏层，每层 128，tanh
    activation: tanh
    fourier_features: 0   # 第一版不加入 Fourier 特征
  air:
    width: 128
    depth: 4
    activation: tanh
    fourier_features: 0
  front:
    width: 64         # 2 个隐藏层，每层 64，tanh
    depth: 2
    activation: tanh
    # 接触面的输出构造。默认关闭，即提示词 §7 的字面形式
    #   hat_Rc = a softplus(z_c)     （a = 参考初值，> 0）
    # 初始位置由初值损失约束。
    #
    # 打开时改为 hat_Rc = a softplus(z_c) + w(s)，w 从 s=0 处的 1 平滑降到
    # s = until_s 处的 0；until_s 省略表示全时段。这是一档**可选的额外约束**，
    # 适用时段与依据见 models/front_net.py 的类文档；打开后 hat_Rc(0) 会精确
    # 等于初始接触位置。
    contact_anchor:
      enabled: false
      until_s: null

# ---------------------------------------------------------------------------
# 采样（提示词 §12 的表格）
# ---------------------------------------------------------------------------
sampling:
  n_pde_product: 1024
  n_pde_air: 1024
  n_ic_product: 256
  n_ic_air: 256
  n_contact: 128
  n_shock: 128
  n_data_product: 256
  n_data_air: 256
  n_data_front: 64
  near_fraction: 0.15     # 内侧 10% 与外侧 10% 区间各占 15%
  near_span: 0.10
  xi_floor: 1.0e-3        # 轴心保护；与 r_min_fraction 相容

# ---------------------------------------------------------------------------
# 训练（提示词 §13）
# ---------------------------------------------------------------------------
training:
  device: cpu
  seeds: [20260920, 20260921, 20260922]
  output_dir: outputs/run
  log_every: 50
  checkpoint_every: 500
  # 固定独立检查集上的物理验收间隔（§13 的"每 500 步"）。保存检查点不等于完成
  # 验收：检查跑的是另一套固定点、独立的采样器、开发帧，不进梯度。
  check_every: 500
  gradient_clip: 1.0
  max_updates: null
  r_min_fraction: 1.0e-2
  lbfgs_iterations: 500

# ---------------------------------------------------------------------------
# 验收目标（提示词 §16）。这些是**内部验收目标**，不是调参旋钮。
# 必须在本轮最终验证结果出来之前固化。
# ---------------------------------------------------------------------------
acceptance:
  pde_rms: 1.0e-2
  pde_absolute_p95: 5.0e-2
  initial_relative_l2: 0.02
  initial_front_absolute: 0.005        # 0.5% R0
  initial_gap_relative: 0.05
  product_mass_drift: 0.01
  box_energy_balance: 0.02
  contact_radius_relative: 0.02
  shock_radius_relative: 0.02
  arrival_time_relative: 0.05
  peak_overpressure_relative: 0.10
  positive_duration_relative: 0.10
  positive_impulse_relative: 0.10
  field_relative_l2: 0.10
