# 球对称 TNT—空气双场 PINN 的基础配置。
#
# 全部内部物理计算采用 SI：m、kg、s、Pa、J/kg。本文件里每一个描述**物理**的
# 数值都逐字对应提示词 §4 的表格；描述**算法**的数值都注明了它来自提示词哪一节。

meta:
  study: "自由空气中球形 TNT 爆炸，1D 球对称双场 PINN"
  scheme: "2026-10-25：t_phys=0 均匀静止产物球 + 静止空气，经 JWL 等熵释放与空气激波 RH 的局部平面黎曼匹配，在小正时间 epsilon 得到 PlanarStartupField"

# ---------------------------------------------------------------------------
# 材料参数（提示词 §4）。这是全仓库唯一的一份数值来源。
# ---------------------------------------------------------------------------
jwl:
  A: 3.7120e11        # Pa
  B: 3.7471e09        # Pa —— 旧项目里出现过的 3.231e9 不是本规范采用的值
  R1: 4.15
  R2: 0.95
  omega: 0.30
  rho0: 1630.0        # kg/m^3
  E0_volume_energy: 6.0e9   # J/m^3，按参考体积定义
  V0: 1.0
  energy_shift: 0.0   # J/kg
  # 仅供参考记录，不用于整球初始压力，也不用 CJ 重新标定 E0。
  detonation_velocity_reference: 6930.0
  p_cj_reference: 2.1e10

air:
  gamma: 1.4
  rho: 1.225
  # §4：这是**卡片**给出的环境压力（*EOS_LINEAR_POLYNOMIAL 的 E0 = 0.2533 MPa，
  # 经 e0 = E0/rho0 得 206775.510 J/kg，再得 p0 = (gamma-1) rho0 e0 = 101320 Pa），
  # **不是**标准大气压 101325 Pa。两者不能混用：DYNA 实际初始化出来的就是 101320，
  # 而 d3plot 里读得到。写 101325 会让 PINN 的环境态与训练数据差 5 Pa。
  pressure: 101320.0

# ---------------------------------------------------------------------------
# 数据。
#
# 训练不读 `data.cases`。监督数据由每个 startup case 的 `data` 条目显式给出
# （`.npz` SupervisionDataset）；旧 `raw_line.npz` 剖面只由
# `cli.audit_data` / `cli.validate_eos` 审计，它们的配置必须自己写 `data.cases`。
# ---------------------------------------------------------------------------
data:
  # 训练/开发划分（§11）：按**连续帧组**留出，不是把同一帧的相邻网格点随机拆开。
  # 当前没有挂接任何 `SupervisionDataset`，所以这里显式写 0：不要让一个为数据
  # 准备的默认值在无数据运行时看起来像"已经做了开发集划分"。
  development_holdout_fraction: 0.0
  development_group_frames: 10
  split_seed: 20260920

# ---------------------------------------------------------------------------
# 新启动场与训练算例（唯一训练用算例清单）。
#
# 每个 case 只有 R_0 不同；ProductNet / AirNet / 前沿参数在所有 case 之间共享。
# 没有 `handoff_json` 时，装配阶段按 `build` 参数构造启动场并写盘。
# ---------------------------------------------------------------------------
startup:
  time_scale: 2.0
  tau_end_s: 1.0e-6
  handoff_dir: outputs/planar_startup
  build:
    delta: 0.005
    outer_radius_factor: 40.0
    inner_cells: 64
    fan_cells: 96
    plateau_cells: 8
    air_cells: 16
    ambient_cells: 64
    dense_samples: 8192
  cases:
    - case_id: tnt_50mm
      charge_radius_m: 0.050
      split: train
    - case_id: tnt_80mm
      charge_radius_m: 0.080
      split: train
    - case_id: tnt_100mm
      charge_radius_m: 0.100
      split: train

splits:
  strict_blind_test: true
  # §16：最终独立验证半径，mm。这些半径**不得**参与调参、初值标定、归一化极值、
  # 早停或选模。`data/isolation.py` 对**实际进入训练**的 startup cases 独立核对
  # 半径，不依赖下面的 split 字符串。
  final_validation_radii_mm: [500.0]
  # 最终验证算例清单只用于验证隔离的"盲测对象是否存在"检查；它不进入训练，
  # 也不被 `startup.cases` 读取。
  final_validation_cases:
    - case_id: tnt_500mm
      charge_radius_m: 0.500
      split: extrapolation_test

# ---------------------------------------------------------------------------
# 网络（提示词 §7）
# ---------------------------------------------------------------------------
networks:
  dtype: float64
  product:
    width: 128
    depth: 4          # 4 个隐藏层，每层 128，tanh
    activation: tanh
    fourier_features: 0   # 第一版不加入 Fourier 特征
  air:
    width: 128
    depth: 4
    activation: tanh
    fourier_features: 0
  front:
    width: 64         # 2 个隐藏层，每层 64，tanh
    depth: 2
    activation: tanh
    # 接触面的输出构造。默认关闭，即提示词 §7 的字面形式
    #   hat_Rc = a softplus(z_c)     （a = 参考初值，> 0）
    # 初始位置由初值损失约束。
    #
    # 打开时改为 hat_Rc = a softplus(z_c) + w(s)，w 从 s=0 处的 1 平滑降到
    # s = until_s 处的 0；until_s 省略表示全时段。这是一档**可选的额外约束**，
    # 适用时段与依据见 models/front_net.py 的类文档；打开后 hat_Rc(0) 会精确
    # 等于初始接触位置。
    contact_anchor:
      enabled: false
      until_s: null

# ---------------------------------------------------------------------------
# 采样（提示词 §12 的表格）
# ---------------------------------------------------------------------------
sampling:
  n_pde_product: 1024
  n_pde_air: 1024
  n_ic_product: 256
  n_ic_air: 256
  n_contact: 128
  n_shock: 128
  near_fraction: 0.15     # 内侧 10% 与外侧 10% 区间各占 15%
  near_span: 0.10
  xi_floor: 1.0e-3        # 轴心保护；与 r_min_fraction 相容

# ---------------------------------------------------------------------------
# 训练（提示词 §13）
# ---------------------------------------------------------------------------
training:
  device: cpu
  seeds: [20260920, 20260921, 20260922]
  output_dir: outputs/run
  log_every: 50
  checkpoint_every: 500
  # 固定独立检查集上的物理验收间隔（§13 的"每 500 步"）。保存检查点不等于完成
  # 验收：检查跑的是另一套固定点、独立的采样器、开发帧，不进梯度。
  check_every: 500
  gradient_clip: 1.0
  max_updates: null
  r_min_fraction: 1.0e-2
  lbfgs_iterations: 500
  # PDE 残差驱动的内部配点细化。关闭时采样行为与原来完全一致。
  rar:
    enabled: false
    interval: 500
    n_candidates_product: 512
    n_candidates_air: 512
    n_select_product: 128
    n_select_air: 128
    pool_capacity_product: 512
    pool_capacity_air: 512
    pool_fraction: 0.25

# ---------------------------------------------------------------------------
# 验收目标（提示词 §16）。这些是**内部验收目标**，不是调参旋钮。
# 必须在本轮最终验证结果出来之前固化。
# ---------------------------------------------------------------------------
acceptance:
  pde_rms: 1.0e-2
  pde_absolute_p95: 5.0e-2
  initial_relative_l2: 0.02
  initial_front_absolute: 0.005        # 0.5% R0
  initial_gap_relative: 0.05
  product_mass_drift: 0.01
  box_energy_balance: 0.02
  contact_radius_relative: 0.02
  shock_radius_relative: 0.02
  arrival_time_relative: 0.05
  peak_overpressure_relative: 0.10
  positive_duration_relative: 0.10
  positive_impulse_relative: 0.10
  field_relative_l2: 0.10
