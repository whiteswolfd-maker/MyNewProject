# Read-only audit of the original LS-DYNA output and the import chain.
#
# This file is independent of the training configs: it names raw directories,
# units, ambient conditions, fixed measurement radii and empirical reference
# sources.  The audit writes its own outputs and never changes caches,
# checkpoints or training settings.
audit:
  version: 1
  repo_root: "."
  require_all_frames: false
  training_config: "configs/contact_air/split_train_r50_500_cw3.yaml"
  output_dir: outputs/reference_audit

  units:
    length: mm
    time: s
    density: tonne/mm^3
    pressure: MPa
    velocity: mm/s
    to_si:
      length: 1.0e-3
      density: 1.0e+12
      pressure: 1.0e+6
      velocity: 1.0e-3

  ambient:
    pressure_mpa: 0.10132
    density_kg_m3: 1.225
    gamma: 1.4

  charge:
    density_kg_m3: 1630.0
    # Uniform-sphere cross-check: W = 4/3 pi rho R^3.
    mass_source: "uniform_sphere_from_material_card"

  references:
    henrych:
      status: provisional
      source: "Henrych (1979), The Dynamics of Explosion and Its Use; spherical free-air burst incident overpressure"
      note: "coefficients commonly reproduced; not checked against a printed copy in this repository"
    kingery_bulmash:
      status: unavailable
      reason: "verified coefficient tables are not present; not guessed or replaced"

  # Fixed physical radii are chosen by scaled distance.  The recorded shock
  # reaches Z approximately 1.32 at the end of every case (that is itself a
  # similarity check), so the common measurable range is kept below it.
  measurement_scaled_distances_m_kg13: [0.5, 0.75, 1.0]
  # Audit these first; the rest are listed for later extension.
  focus_cases: [r50_full, r500_full, r1000_full]

  cases:
    - {case_id: r50_full,   radius_m: 0.050, raw_dir: "G:/R50_R100_reference_v2/R50_full_alpha_profiles", deck: "R50_full_reference_alpha_profiles.k", standard: "outputs/contact_air_r50/standard_1d.npz",   cache: "outputs/contact_air_r50/cache.npz"}
    - {case_id: r100_full,  radius_m: 0.100, raw_dir: "G:/R50_R100_reference_v2/R100", deck: "R100_full_reference_vf_fixed.k", standard: "outputs/contact_air_r100/standard_1d.npz",  cache: "outputs/contact_air_r100/cache.npz"}
    - {case_id: r150_full,  radius_m: 0.150, raw_dir: "G:/R50_R100_reference_v2/R150", deck: "R150_full_reference.k", standard: "outputs/contact_air_r150/standard_1d.npz",  cache: "outputs/contact_air_r150/cache.npz"}
    - {case_id: r200_full,  radius_m: 0.200, raw_dir: "G:/R50_R100_reference_v2/R200", deck: "R200_full_reference.k", standard: "outputs/contact_air_r200/standard_1d.npz",  cache: "outputs/contact_air_r200/cache.npz"}
    - {case_id: r250_full,  radius_m: 0.250, raw_dir: "G:/R50_R100_reference_v2/R250", deck: "R250_full_reference.k", standard: "outputs/contact_air_r250/standard_1d.npz",  cache: "outputs/contact_air_r250/cache.npz"}
    - {case_id: r300_full,  radius_m: 0.300, raw_dir: "G:/R50_R100_reference_v2/R300", deck: "R300_full_reference.k", standard: "outputs/contact_air_r300/standard_1d.npz",  cache: "outputs/contact_air_r300/cache.npz"}
    - {case_id: r350_full,  radius_m: 0.350, raw_dir: "G:/R50_R100_reference_v2/R350", deck: "R350_full_reference.k", standard: "outputs/contact_air_r350/standard_1d.npz",  cache: "outputs/contact_air_r350/cache.npz"}
    - {case_id: r400_full,  radius_m: 0.400, raw_dir: "G:/R50_R100_reference_v2/R400", deck: "R400_full_reference.k", standard: "outputs/contact_air_r400/standard_1d.npz",  cache: "outputs/contact_air_r400/cache.npz"}
