# Read-only audit of the d3plot-state imported data.
#
# It reads the d3plot-state standards in outputs/fullframes/standard and the
# caches in outputs/fullframes/cache.  The source decks are BEAMIP=0
# ``R*_d3plot_v5.k`` files under G:/50-500 and D:/550-1000; each state time
# comes from the d3plot header with full precision.  Every case is audited;
# the importer records frame_selection_policy=all_states.
audit:
  version: 2
  repo_root: .
  require_all_frames: true
  training_config: "configs/contact_air/split_train_r50_500_fullframes.yaml"
  output_dir: outputs/reference_audit_fullframes
  units:
    length: mm
    time: s
    density: tonne/mm^3
    pressure: MPa
    velocity: mm/s
    to_si:
      length: 0.001
      density: 1000000000000.0
      pressure: 1000000.0
      velocity: 0.001
  ambient:
    pressure_mpa: 0.10132
    density_kg_m3: 1.225
    gamma: 1.4
  charge:
    density_kg_m3: 1630.0
    mass_source: uniform_sphere_from_material_card
  references:
    henrych:
      status: provisional
      source: Henrych (1979), The Dynamics of Explosion and Its Use; spherical free-air
        burst incident overpressure
      note: coefficients commonly reproduced; not checked against a printed copy in
        this repository
    kingery_bulmash:
      status: unavailable
      reason: verified coefficient tables are not present; not guessed or replaced
  measurement_scaled_distances_m_kg13:
  - 0.5
  - 0.75
  - 1.0
  focus_cases:
  - r50_full
  - r100_full
  - r150_full
  - r200_full
  - r250_full
  - r300_full
  - r350_full
  - r400_full
  - r450_full
  - r500_full
  - r550_full
  - r600_full
  - r650_full
  - r700_full
  - r750_full
  - r800_full
  - r850_full
  - r900_full
  - r950_full
  - r1000_full
  cases:
  - case_id: r50_full
    radius_m: 0.05
    raw_dir: G:/50-500/50
    deck: R50_d3plot_v5.k
    standard: outputs/fullframes/standard/r50_full.npz
    cache: outputs/fullframes/cache/r50_full.npz
  - case_id: r100_full
    radius_m: 0.1
    raw_dir: G:/50-500/100
    deck: R100_d3plot_v5.k
    standard: outputs/fullframes/standard/r100_full.npz
    cache: outputs/fullframes/cache/r100_full.npz
  - case_id: r150_full
    radius_m: 0.15
    raw_dir: G:/50-500/150
