# Read-only audit of the ORIGINAL and FULL-FRAME imported data.
#
# This is the full-frame counterpart of reference_audit.yaml.  It reads the
# all-frames standards in outputs/fullframes/standard and the caches in
# outputs/fullframes/cache.  The old strided standards/caches are not touched.
# Every case is audited; frame_selection_policy must be all_frames.
audit:
  version: 2
  repo_root: .
  require_all_frames: true
  training_config: "configs/contact_air/split_train_r50_500_fullframes.yaml"
  output_dir: outputs/reference_audit_fullframes
  units:
    length: mm
    time: s
    density: tonne/mm^3
    pressure: MPa
    velocity: mm/s
    to_si:
      length: 0.001
      density: 1000000000000.0
      pressure: 1000000.0
      velocity: 0.001
  ambient:
    pressure_mpa: 0.10132
    density_kg_m3: 1.225
    gamma: 1.4
  charge:
    density_kg_m3: 1630.0
    mass_source: uniform_sphere_from_material_card
  references:
    henrych:
      status: provisional
      source: Henrych (1979), The Dynamics of Explosion and Its Use; spherical free-air
        burst incident overpressure
      note: coefficients commonly reproduced; not checked against a printed copy in
        this repository
    kingery_bulmash:
      status: unavailable
      reason: verified coefficient tables are not present; not guessed or replaced
  measurement_scaled_distances_m_kg13:
  - 0.5
  - 0.75
  - 1.0
  focus_cases:
  - r50_full
  - r100_full
  - r150_full
  - r200_full
  - r250_full
  - r300_full
  - r350_full
  - r400_full
  - r450_full
  - r500_full
  - r550_full
  - r600_full
  - r650_full
  - r700_full
  - r750_full
  - r800_full
  - r850_full
  - r900_full
  - r950_full
  - r1000_full
  cases:
  - case_id: r50_full
    radius_m: 0.05
    raw_dir: G:/R50_R100_reference_v2/R50_full_alpha_profiles
    deck: R50_full_reference_alpha_profiles.k
    standard: outputs/fullframes/standard/r50_full.npz
    cache: outputs/fullframes/cache/r50_full.npz
  - case_id: r100_full
    radius_m: 0.1
    raw_dir: G:/R50_R100_reference_v2/R100
    deck: R100_full_reference_vf_fixed.k
    standard: outputs/fullframes/standard/r100_full.npz
    cache: outputs/fullframes/cache/r100_full.npz
  - case_id: r150_full
    radius_m: 0.15
    raw_dir: G:/R50_R100_reference_v2/R150
    deck: R150_full_reference.k
    standard: outputs/fullframes/standard/r150_full.npz
    cache: outputs/fullframes/cache/r150_full.npz
  - case_id: r200_full
    radius_m: 0.2
