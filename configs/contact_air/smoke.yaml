# Tiny synthetic engineering check for the one-dimensional ContactNet/AirNet
# path.  This is a PROGRAM-RUN check, not a data split and not a TNT result.
# The only configured radius is 50 mm; that is a smoke fixture, not a claim
# that 50/80/100 mm are the training set or that 500 mm is a blind test.
inherits: base.yaml

contact_air:
  cases:
    - case_id: tnt_50mm
      role: train
      charge_radius_m: 0.050
      cache: null
      synthetic: true
      duration_s: 2.0e-5
      n_frames: 21
      n_radial: 2400

  networks:
    contact:
      width: 8
      depth: 1
    air:
      width: 8
      depth: 1

  sampling:
    n_pde: 16
    n_ic: 8
    n_right: 8
    n_data: 16
    n_contact: 8

  training:
    loops: 4
    log_every: 1
    checkpoint_every: 2
    validate_every: 2
    seed: 7

  output_dir: outputs/contact_air_smoke

  validation:
    holdout_fraction: 0.3
    data_points: 32
    contact_points: 32
