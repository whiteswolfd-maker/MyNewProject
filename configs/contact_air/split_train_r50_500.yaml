# Radius-band split requested on 2026-11-13:
#   train      : R50, R100, ..., R500   (10 cases)
#   validation : R550, R600, ..., R1000 (10 cases, disjoint radii)
#
# The validation band is never sampled for training.  It is scored every
# validation.validate_every loops and can select best.pt.  Because the split
# is by radius, validation.holdout_fraction is 0: every frame of every train
# case is usable for training, and the held-out signal comes from the
# disjoint radius band instead of from late-time frames of the same cases.
#
# All 20 caches come from the real LS-DYNA profiles; none is synthetic.
inherits: base.yaml

contact_air:
  precursor:
    material_source: "G:/R50_R100_reference_v2/R50_full/R50_full_reference.k"
    material_source_verified: true

  contact_interval:
    # Caches for R150-R1000 were built with this window (see all_real.yaml).
    event_search_window_s: 5.0e-5

  cases:
    - {case_id: r50_full,   role: train,      charge_radius_m: 0.050, cache: outputs/contact_air_r50/cache.npz,   synthetic: false}
    - {case_id: r100_full,  role: train,      charge_radius_m: 0.100, cache: outputs/contact_air_r100/cache.npz,  synthetic: false}
    - {case_id: r150_full,  role: train,      charge_radius_m: 0.150, cache: outputs/contact_air_r150/cache.npz,  synthetic: false}
    - {case_id: r200_full,  role: train,      charge_radius_m: 0.200, cache: outputs/contact_air_r200/cache.npz,  synthetic: false}
    - {case_id: r250_full,  role: train,      charge_radius_m: 0.250, cache: outputs/contact_air_r250/cache.npz,  synthetic: false}
    - {case_id: r300_full,  role: train,      charge_radius_m: 0.300, cache: outputs/contact_air_r300/cache.npz,  synthetic: false}
    - {case_id: r350_full,  role: train,      charge_radius_m: 0.350, cache: outputs/contact_air_r350/cache.npz,  synthetic: false}
    - {case_id: r400_full,  role: train,      charge_radius_m: 0.400, cache: outputs/contact_air_r400/cache.npz,  synthetic: false}
    - {case_id: r450_full,  role: train,      charge_radius_m: 0.450, cache: outputs/contact_air_r450/cache.npz,  synthetic: false}
    - {case_id: r500_full,  role: train,      charge_radius_m: 0.500, cache: outputs/contact_air_r500/cache.npz,  synthetic: false}
    - {case_id: r550_full,  role: validation, charge_radius_m: 0.550, cache: outputs/contact_air_r550/cache.npz,  synthetic: false}
    - {case_id: r600_full,  role: validation, charge_radius_m: 0.600, cache: outputs/contact_air_r600/cache.npz,  synthetic: false}
    - {case_id: r650_full,  role: validation, charge_radius_m: 0.650, cache: outputs/contact_air_r650/cache.npz,  synthetic: false}
    - {case_id: r700_full,  role: validation, charge_radius_m: 0.700, cache: outputs/contact_air_r700/cache.npz,  synthetic: false}
    - {case_id: r750_full,  role: validation, charge_radius_m: 0.750, cache: outputs/contact_air_r750/cache.npz,  synthetic: false}
    - {case_id: r800_full,  role: validation, charge_radius_m: 0.800, cache: outputs/contact_air_r800/cache.npz,  synthetic: false}
    - {case_id: r850_full,  role: validation, charge_radius_m: 0.850, cache: outputs/contact_air_r850/cache.npz,  synthetic: false}
    - {case_id: r900_full,  role: validation, charge_radius_m: 0.900, cache: outputs/contact_air_r900/cache.npz,  synthetic: false}
    - {case_id: r950_full,  role: validation, charge_radius_m: 0.950, cache: outputs/contact_air_r950/cache.npz,  synthetic: false}
    - {case_id: r1000_full, role: validation, charge_radius_m: 1.000, cache: outputs/contact_air_r1000/cache.npz, synthetic: false}

  output_dir: outputs/contact_air_split_r50_500

  # Sampling counts are totals split across the 10 training cases, not
  # per-case budgets.  The base 512/128/128/128/128 would give only ~51 PDE,
  # ~12 data and ~12 contact points per case; scale the totals with the case
  # count so each radius keeps a usable signal per loop.
  sampling:
    n_pde: 2048
    n_ic: 512
    n_right: 512
    n_data: 512
    n_contact: 512

  training:
    loops: 2000
    log_every: 50
    checkpoint_every: 100
    validate_every: 100

  validation:
    # Radius-band holdout replaces the internal late-frame holdout.
    holdout_fraction: 0.0
    data_points: 256
    contact_points: 256
