# 冒烟配置：把更新次数与采样点数缩到分钟级，只用来验证装配能跑通。
# **它不是物理结果**，任何用它得到的数都不能当作训练完成或精度证据。
inherits: ../base.yaml

sampling:
  n_pde_product: 256
  n_pde_air: 256
  n_ic_product: 64
  n_ic_air: 64
  n_contact: 32
  n_shock: 32

data:
  # 本配置连的是真实算例，但**兼容性审查还没按方案 B 重跑**（旧的审查报告是按
  # 方案 A 的判据写的）。冒烟检查的用途是"整条链路能跑通"，不是物理训练，所以
  # 这里显式越过兼容性闸门。越过的后果会被记录：运行清单与检查点都会带上
  # ``data_compatibility = unverified``，任何由它得到的数都不能当作精度证据。
  allow_unverified_cases: true

training:
  output_dir: outputs/smoke
  log_every: 5
  checkpoint_every: 20
  check_every: 20
  max_updates: 40
  seeds: [20260920]
