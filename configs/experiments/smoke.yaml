# 冒烟配置：把更新次数与采样点数缩到分钟级，只用来验证装配能跑通。
# **它不是物理结果**，任何用它得到的数都不能当作训练完成或精度证据。
#
# 算例清单来自 `base.yaml` 的 `startup.cases`（50/80/100 mm 共用一套网络）。
# 当前没有挂接 `SupervisionDataset`；这是纯物理损失链路检查。
inherits: ../base.yaml

sampling:
  n_pde_product: 256
  n_pde_air: 256
  n_ic_product: 64
  n_ic_air: 64
  n_contact: 32
  n_shock: 32

training:
  output_dir: outputs/smoke
  log_every: 5
  checkpoint_every: 20
  check_every: 20
  max_updates: 40
  seeds: [20260920]
